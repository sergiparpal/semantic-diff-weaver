[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "semantic-diff-weaver"
version = "0.2.0"
description = "Read-only semantic Git diff analysis and risk-ranked test obligations, from a CLI, a GitHub Action, or Hermes Agent."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Semantic Diff Weaver contributors" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "pydantic>=2.10,<3",
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40,<1"]

[project.scripts]
semantic-diff-weaver = "semantic_diff_weaver.cli:main"

[project.entry-points."hermes_agent.plugins"]
semantic-diff-weaver = "semantic_diff_weaver.plugin"

[tool.hatch.build.targets.wheel]
packages = ["semantic_diff_weaver"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/.coverage",
  "/.pytest_cache",
  "/.pytest_tmp",
  "/.venv",
  "/dist",
  "/tests",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
timeout = 30
markers = [
  "performance: bounded performance regression tests",
]

[tool.coverage.run]
branch = true
source = ["semantic_diff_weaver"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", ".pytest_tmp", "dist", "tests/fixtures/repositories"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "PTH", "RUF", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Asserts are the point of a test. S105/S108 are deliberately fake credentials and path
# literals used as redaction and path-validation fixtures; S603 is the shell-free, argument-
# list-only subprocess boundary these harnesses build by hand, as production code does.
"tests/**/*.py" = ["S101", "S105", "S108", "S603"]
"scripts/*.py" = ["S101", "S603"]

[tool.mypy]
python_version = "3.11"
# `tests/contract` is type-checked alongside the package so the `LlmClient` conformance
# assignments in `test_llm_client_protocol.py` are enforced by the standard gate rather
# than only when someone points mypy at the file. The rest of the suite stays out: its
# fixtures deliberately build malformed values to exercise validation.
files = ["semantic_diff_weaver", "tests/contract"]
explicit_package_bases = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_ignores = true
disable_error_code = ["import-untyped"]

# `anthropic` is an optional extra, so it is absent from the base development environment
# and from the type-check job. The adapter imports it lazily inside a try/except and treats
# its absence as a notice, so an unresolved import here is expected rather than a defect.
[[tool.mypy.overrides]]
module = ["anthropic", "anthropic.*"]
ignore_missing_imports = true
