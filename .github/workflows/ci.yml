name: ci

# A pull request runs every check before its merge, and main runs them again on the merged
# commit. A push to any other branch, or a tag on a commit main has run, would only repeat a run,
# with a second ci-complete that can fail on its own, as a leg left without a runner does.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
          - os: windows-latest
            python: "3.11"
          - os: windows-latest
            python: "3.14"
          # macOS on Intel, not macos-latest's arm64: GitHub leaves the arm64 pool short of
          # runners, and a leg no runner takes fails ci-complete after 15 minutes in the queue,
          # as in 8 of this leg's 19 attempts on 2026-11-04. The package is pure Python, so
          # what this leg tests is macOS, not the processor.
          - os: macos-26-intel
            python: "3.14"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install . --no-deps
      - run: >-
          python -m pytest
          --cov=semantic_diff_weaver
          --cov-branch
          --cov-report=json:coverage.json
          --cov-report=term-missing
      - run: python scripts/check_coverage.py coverage.json
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m build
      - run: python scripts/verify_wheel.py dist

  action-pins:
    # Dependabot rewrites the workflows but never the YAML quoted in README.md and docs/, so
    # the two drift apart on every bump unless something compares them. Offline and dependency
    # free: it must fail on the Dependabot pull request itself, not a week later.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python scripts/check_action_pins.py

  hermes-compatibility:
    # The lowest Hermes release the plugin supports, from PyPI. The current release is not on
    # PyPI, which stops at 0.19.0, and the hermes-current job builds it from its Git tag.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        hermes-version: ["0.14.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install "hermes-agent==${{ matrix.hermes-version }}"
      - run: python -m build
      - run: python -m pip install dist/semantic_diff_weaver-*.whl
      - run: python scripts/verify_hermes.py

  hermes-current:
    # The current Hermes release, built the way its own installer builds it. Releases after
    # 0.19.0 exist only as Git tags, declare their dependencies only for Python 3.14, and resolve
    # them only through the uv lock they ship: two of their exact pins conflict without its
    # overrides, so pip cannot install them. The plugin is installed first the way a user installs
    # it, through `hermes plugins install` and its install-time scan, while Hermes's environment
    # still lacks this project's wheel and PyYAML, which Hermes itself has to install. Only then
    # does the wheel go in for the entry-point and directory discovery checks.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HERMES_TAG: "v0.23.0"
      # The commit the tag names when it was verified. A tag can be moved; this cannot.
      HERMES_COMMIT: "2bd378ed1b8d6bf2192cb26e0a55ff3091e6bd19"
      # The uv that Hermes's installer pins at that tag, in its scripts/install.sh.
      UV_VERSION: "0.13.5"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock "uv==${UV_VERSION}"
      - name: Fetch Hermes at its release tag and check the commit
        run: |
          git -c advice.detachedHead=false clone --quiet --depth 1 --branch "${HERMES_TAG}" \
            https://github.com/NousResearch/hermes-agent.git "${RUNNER_TEMP}/hermes-agent"
          fetched="$(git -C "${RUNNER_TEMP}/hermes-agent" rev-parse HEAD)"
          if [ "${fetched}" != "${HERMES_COMMIT}" ]; then
            echo "::error::${HERMES_TAG} names ${fetched}, not the verified ${HERMES_COMMIT}."
            exit 1
          fi
      - name: Build Hermes's environment from its lock
        env:
          UV_NO_CONFIG: "1"
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/hermes-env
        run: >-
          uv sync --quiet --frozen --no-dev
          --project "${RUNNER_TEMP}/hermes-agent"
          --python "$(command -v python)"
      - name: Install the plugin the way a user does
        run: '"${RUNNER_TEMP}/hermes-env/bin/python" scripts/verify_hermes_install.py'
      - run: python -m build
      - run: >-
          uv pip install --quiet
          --python "${RUNNER_TEMP}/hermes-env/bin/python"
          dist/semantic_diff_weaver-*.whl
      - run: '"${RUNNER_TEMP}/hermes-env/bin/python" scripts/verify_hermes.py'

  ci-complete:
    # One stable check name for the branch ruleset to require. Matrix legs come and go, so
    # requiring them individually would turn a dropped Python version into a required check
    # that never reports again — and an unsatisfiable required check blocks every merge.
    # This job depends on the ones that must pass and fails unless all of them succeeded.
    if: always()
    needs: [test, action-pins, hermes-compatibility, hermes-current]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Fail unless every required job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "A required job did not succeed:"
          echo '${{ toJSON(needs) }}'
          exit 1
      # needs.*.result alone can pass a leg that never ran: GitHub reports a matrix job as a
      # success when one of its legs is cancelled because no runner took it, though the run
      # itself fails. So every leg of every required job is read from this run attempt, where
      # a leg is named after its job, and each must have succeeded. needs holds this job until
      # every leg has finished, yet the listing can lag a leg that just did, as it lagged a
      # re-run leg that had passed two seconds before. A leg listed without a conclusion is
      # read again, for up to a minute, before the gate decides; a leg with one is final.
      - name: Fail unless every leg of every required job succeeded
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          for read in 1 2 3 4 5 6 7; do
            legs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" --jq '
              if .total_count > (.jobs | length) then error("the run has more jobs than one page lists") else . end
              | .jobs as $jobs
              | ($ENV.NEEDS | fromjson | keys[]) as $need
              | [$jobs[] | select(.name == $need or (.name | startswith($need + " (")))]
              | if length == 0 then error("no job of this run is named after \($need)") else .[] end
              | "\(.conclusion // ("unfinished: " + .status))\t\(.name)"')
            echo "$legs"
            if ! printf '%s\n' "$legs" | grep -q '^unfinished: '; then
              break
            fi
            if [ "$read" -lt 7 ]; then
              echo "A leg is listed without a conclusion; reading the jobs again in 10 seconds."
              sleep 10
            fi
          done
          if printf '%s\n' "$legs" | grep -qv $'^success\t'; then
            echo "A leg of a required job did not succeed."
            exit 1
          fi
