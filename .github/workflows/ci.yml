name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
          - os: windows-latest
            python: "3.11"
          - os: windows-latest
            python: "3.14"
          - os: macos-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install . --no-deps
      - run: >-
          python -m pytest
          --cov=semantic_diff_weaver
          --cov-branch
          --cov-report=json:coverage.json
          --cov-report=term-missing
      - run: python scripts/check_coverage.py coverage.json
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m build
      - run: python scripts/verify_wheel.py dist

  action-pins:
    # Dependabot rewrites the workflows but never the YAML quoted in README.md and docs/, so
    # the two drift apart on every bump unless something compares them. Offline and dependency
    # free: it must fail on the Dependabot pull request itself, not a week later.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python scripts/check_action_pins.py

  hermes-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hermes-version: ["0.14.0", "0.18.2"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install "hermes-agent==${{ matrix.hermes-version }}"
      - run: python -m build
      - run: python -m pip install dist/semantic_diff_weaver-*.whl
      - run: python scripts/verify_hermes.py
