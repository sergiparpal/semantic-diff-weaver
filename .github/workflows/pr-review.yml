name: pr-review

# Dogfooding: this repository runs its own action on its own pull requests.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

# Cancel superseded runs on the same ref to save CI minutes. It matters more here
# than in `ci`: this workflow posts a comment, so three pushes to a pull request
# leave three reviews of diffs that no longer exist. `ci-complete` is the only
# required check, so a cancelled run here never blocks a merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # fetch-depth: 0 is required. The analyzer reads committed Git objects and never
      # fetches, so a shallow clone leaves the base commit absent and the action fails
      # with an explicit message rather than analyzing the wrong range.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./
        with:
          include: |
            semantic_diff_weaver/**/*.py
            scripts/*.py
          fail-on: none
          comment: true
