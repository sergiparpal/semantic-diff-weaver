name: action-pins

# The offline half of this policy runs in `ci` on every pull request. This workflow adds the
# two checks that need the network and must never break an unrelated branch:
#
#   --verify-remote  confirms each pinned SHA really is the commit its `# vX.Y.Z` comment
#                    claims, which no amount of local comparison can establish;
#   --check-latest   reports pins upstream has moved past. Dependabot already does this for
#                    `.github/workflows/`, but actions that appear only in documentation —
#                    the upload-artifact and download-artifact examples in
#                    docs/github-action.md — are invisible to it and rot silently.
#
# A failure here is a notification, not a broken build: nothing merges through this workflow.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Grouped, but deliberately NOT cancelling — the opposite of `ci` and `pr-review`.
# This is a weekly cron plus manual dispatch, so there is no superseded commit to
# save minutes on, and every run shares the default branch's ref. With
# `cancel-in-progress: true` a manual dispatch would silently kill the scheduled
# check, or the schedule would kill someone's dispatch, and a check nobody sees
# fail is worse than one that waits. The group only stops two of them hitting the
# network verification at once.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python scripts/check_action_pins.py --verify-remote --check-latest
        env:
          # Raises the API rate limit from 60 to 1000 requests an hour. The script reads only
          # public tag and release metadata, so the default read-only token is enough.
          GITHUB_TOKEN: ${{ github.token }}
