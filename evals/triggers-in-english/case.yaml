schema_version: "1.1"
name: triggers-in-english
description: >-
  The same question in English loads the skill and gets the same analysis.
tags: [trigger, english]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    What does this branch change compared to main, and what should I test before merging it?
  max_turns: 20
  timeout_seconds: 600
  allowed_tools:
    - Bash
    - Read
    - Glob
    - Grep
    - Skill
    - mcp__plugin_semantic-diff-weaver_semantic-diff-weaver__analyze_semantic_diff
    - mcp__plugin_semantic-diff-weaver_semantic-diff-weaver__generate_test_skeletons
graders:
  - name: skill-fires
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?semantic-diff"'
  - name: analyzes
    type: tool_used
    tool: mcp__plugin_semantic-diff-weaver_semantic-diff-weaver__analyze_semantic_diff
    min: 1
  - name: no-unapproved-skeletons
    type: tool_used
    tool: mcp__plugin_semantic-diff-weaver_semantic-diff-weaver__generate_test_skeletons
    min: 0
    max: 0
  - name: quotes-the-new-comparison
    type: regex
    pattern: 'count <= MAX_ITEMS'
  - name: cites-an-obligation
    type: regex
    pattern: 'to-00[12]'
  - name: reports-the-boundary
    type: llm
    criteria: >-
      The answer says that a basket of exactly MAX_ITEMS (5) items is now allowed, where before
      the change it was not, and suggests a test for exactly that case.
